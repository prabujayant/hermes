[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-api"
version = "0.1.0"
description = "Publish posts to Meta Threads programmatically"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
threads-publish = "threads_api.cli:main"