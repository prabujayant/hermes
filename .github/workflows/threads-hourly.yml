name: Threads hourly post
# Publishes one bank thread per hour via threads_api post-hourly.

on:
  schedule:
    # Hourly. (Tried 3x/hour: GitHub deprioritises high-frequency
    # schedules and fired zero runs in 9h. The 50-min guard keeps
    # overlapping attempts from double-posting.)
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass time/cap guards (testing)"
        required: false
        default: "false"

concurrency:
  group: threads-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # NOTE: no pip cache — on SKIP hours pip never runs, leaving
          # no cache dir, which fails the run in setup-python's post step.

      - name: Schedule guard (stdlib only, skips install when idle)
        id: guard
        working-directory: threads_api
        run: |
          set +e
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            python -m threads_api.guard queue/posted.jsonl
            code=$?
            if [ "$code" = "0" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            elif [ "$code" = "2" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              exit 1
            fi
          fi

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: threads_api
        run: pip install -r requirements.txt

      - name: Write credentials
        if: steps.guard.outputs.skip != 'true'
        working-directory: threads_api
        run: |
          printf 'APP_ID=%s\nAPP_SECRET=%s\nACCESS_TOKEN=%s\nTHREADS_USER_ID=%s\nOPENROUTER_API_KEY=%s\n' \
            "${{ secrets.APP_ID }}" \
            "${{ secrets.APP_SECRET }}" \
            "${{ secrets.ACCESS_TOKEN }}" \
            "${{ secrets.THREADS_USER_ID }}" \
            "${{ secrets.OPENROUTER_API_KEY }}" > .env

      - name: Verify connection (fails loud on expired token)
        if: steps.guard.outputs.skip != 'true'
        working-directory: threads_api
        run: python -m threads_api.cli verify

      - name: Publish next scheduled thread
        if: steps.guard.outputs.skip != 'true'
        working-directory: threads_api
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m threads_api.cli post-smart --force
          else
            python -m threads_api.cli post-smart
          fi

      - name: Commit rotation state
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add threads_api/queue/state.json threads_api/queue/posted.jsonl threads_api/queue/strategy.json threads_api/queue/replies_state.json || true
          git diff --cached --quiet || git commit -m "chore: hourly post rotation state"
          git pull --rebase || true
          git push
