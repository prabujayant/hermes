name: Threads hourly post

on:
  schedule:
    # :07 past the hour to dodge top-of-hour queue delays (UTC).
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: threads-hourly
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: threads_api
        run: pip install -r requirements.txt

      - name: Write credentials
        working-directory: threads_api
        run: |
          printf 'APP_ID=%s\nAPP_SECRET=%s\nACCESS_TOKEN=%s\nTHREADS_USER_ID=%s\n' \
            "${{ secrets.APP_ID }}" \
            "${{ secrets.APP_SECRET }}" \
            "${{ secrets.ACCESS_TOKEN }}" \
            "${{ secrets.THREADS_USER_ID }}" > .env

      - name: Verify connection (fails loud on expired token)
        working-directory: threads_api
        run: python -m threads_api.cli verify

      - name: Publish next scheduled thread
        working-directory: threads_api
        run: python -m threads_api.cli post-hourly

      - name: Commit rotation state
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add threads_api/queue/state.json threads_api/queue/posted.jsonl || true
          git diff --cached --quiet || git commit -m "chore: hourly post rotation state"
          git push
